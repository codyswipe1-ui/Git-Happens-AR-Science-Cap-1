<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cell model viewer</title>
<style>html,body{height:100%;margin:0;background:#15134f;color:white;font-family:system-ui}model-viewer{width:100%;height:100%}#status{position:absolute;top:16px;left:16px;right:16px;pointer-events:none}button{position:absolute;bottom:16px;right:16px;padding:12px;border:0;border-radius:8px;cursor:pointer}</style></head><body>
<model-viewer camera-controls touch-action="pan-y" shadow-intensity="0.5" exposure="1" alt="Interactive cell model"></model-viewer><div id="status" role="status">Loading 3D model…</div><button id="reset">Reset view</button>
<script type="module">
const viewer=document.querySelector('model-viewer'), status=document.querySelector('#status');
const name=new URLSearchParams(location.search).get('model');
viewer.addEventListener('load',()=>status.hidden=true);
viewer.addEventListener('error',()=>{status.hidden=false;status.textContent='Could not load this model. Reload to try again.';});
document.querySelector('#reset').onclick=()=>{viewer.cameraOrbit='auto auto auto';viewer.cameraTarget='auto auto auto';viewer.fieldOfView='auto';};
try {
 await import('https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js');
 if(!['animal','plant','human'].includes(name))throw Error('Unknown model');
 viewer.src='./models/'+name+'.glb';
} catch(e){status.textContent='Unable to load the 3D viewer. Check your internet connection and reload.';}
</script></body></html>
